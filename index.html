<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Watch to Unlock</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --tg-bg: #17212b;
    --tg-text: #ffffff;
    --tg-hint: #708499;
    --tg-button: #5288c1;
    --tg-button-text: #ffffff;
    --tg-secondary-bg: #232e3c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--tg-bg);
    color: var(--tg-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    max-width: 640px;
    margin: 0 auto;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 8px 0 4px;
    text-align: center;
  }
  #status {
    color: var(--tg-hint);
    font-size: 14px;
    text-align: center;
    margin: 0 0 16px;
    min-height: 18px;
  }
  #player-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
  }
  #player { width: 100%; height: 100%; }
  #adGate {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px;
    text-align: center;
    z-index: 5;
  }
  #adGate.hidden { display: none; }
  #adGateText {
    font-size: 14px;
    color: var(--tg-hint);
    margin: 0;
  }
  #adCountdown {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
  }
  .gate-btn {
    width: 100%;
    max-width: 320px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--tg-button);
    color: var(--tg-button-text);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .gate-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .gate-btn.hidden { display: none; }
  #claimBtn {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--tg-button);
    color: var(--tg-button-text);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  #claimBtn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  #likeBtn {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border: 1px solid var(--tg-button);
    border-radius: 10px;
    background: transparent;
    color: var(--tg-text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #errorBox {
    background: var(--tg-secondary-bg);
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    margin-top: 40px;
  }
</style>
</head>
<body>
<div id="app">
  <h1>Watch to unlock your bonus</h1>
  <p id="status">Loading video…</p>
  <div id="player-wrap">
    <div id="player"></div>
    <div id="adGate" class="hidden">
      <p id="adGateText">Tap below to continue — a quick sponsor page will open.</p>
      <button id="adStartBtn" class="gate-btn">▶️ Start</button>
      <p id="adCountdown" class="hidden"></p>
      <button id="adContinueBtn" class="gate-btn hidden">▶️ Watch Now</button>
    </div>
  </div>
  <button id="likeBtn">👍 Like on YouTube</button>
  <button id="claimBtn" disabled>Watch the full video to unlock</button>
</div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  const params = new URLSearchParams(window.location.search);
  const videoId = params.get("v");
  const adUrl = params.get("ad");
  const AD_COUNTDOWN_SECONDS = 11;

  const statusEl = document.getElementById("status");
  const claimBtn = document.getElementById("claimBtn");
  const likeBtn = document.getElementById("likeBtn");
  const appEl = document.getElementById("app");
  const adGateEl = document.getElementById("adGate");
  const adStartBtn = document.getElementById("adStartBtn");
  const adCountdownEl = document.getElementById("adCountdown");
  const adContinueBtn = document.getElementById("adContinueBtn");

  function applyTheme(theme) {
    if (!theme) return;
    const root = document.documentElement.style;
    if (theme.bg_color) root.setProperty("--tg-bg", theme.bg_color);
    if (theme.text_color) root.setProperty("--tg-text", theme.text_color);
    if (theme.hint_color) root.setProperty("--tg-hint", theme.hint_color);
    if (theme.button_color) root.setProperty("--tg-button", theme.button_color);
    if (theme.button_text_color) root.setProperty("--tg-button-text", theme.button_text_color);
    if (theme.secondary_bg_color) root.setProperty("--tg-secondary-bg", theme.secondary_bg_color);
  }

  function showFatalError(message) {
    appEl.innerHTML = '<div id="errorBox"><p>' + message + "</p></div>";
  }

  if (!tg) {
    showFatalError("Please open this page from the bot, not directly in a browser.");
    return;
  }

  tg.ready();
  tg.expand();
  applyTheme(tg.themeParams);
  tg.onEvent("themeChanged", function () { applyTheme(tg.themeParams); });

  if (!videoId) {
    showFatalError("No video is configured yet. Check back soon.");
    return;
  }

  likeBtn.addEventListener("click", function () {
    const youtubeUrl = "https://www.youtube.com/watch?v=" + encodeURIComponent(videoId);
    if (typeof tg.openLink === "function") {
      tg.openLink(youtubeUrl);
    } else {
      window.open(youtubeUrl, "_blank");
    }
  });

  // Ad gate: user must tap Start (opens the ad link) and wait out a flat
  // countdown before the real watch-to-unlock stage becomes reachable.
  // Skipped entirely when no ad link is configured.
  //
  // This is a plain timer, not an "is the user actually looking at the ad"
  // check — Telegram's Mini App embedding (confirmed on mobile) doesn't
  // propagate any focus/visibility signal to this page when openLink hands
  // off to its in-app/external browser, so there is no reliable way for
  // client-side JS here to detect that. A determined user can still wait out
  // the timer without viewing the ad; closing that gap for real requires a
  // CPA/link-locker network with server-side postback verification, which is
  // a separate backend project, not a page-side fix.
  let adGatePassed = !adUrl;

  if (adUrl) {
    adGateEl.classList.remove("hidden");
    statusEl.textContent = "Complete the step below to unlock the video.";

    adStartBtn.addEventListener("click", function () {
      adStartBtn.disabled = true;
      adStartBtn.classList.add("hidden");
      if (typeof tg.openLink === "function") {
        tg.openLink(adUrl);
      } else {
        window.open(adUrl, "_blank");
      }
      beginAdCountdown();
    });

    adContinueBtn.addEventListener("click", function () {
      adGatePassed = true;
      adGateEl.classList.add("hidden");
      statusEl.textContent = "Watch the full video to unlock your bonus.";
    });
  }

  function beginAdCountdown() {
    let remaining = AD_COUNTDOWN_SECONDS;
    adCountdownEl.classList.remove("hidden");
    adCountdownEl.textContent = "You can continue in " + remaining + "s…";
    const interval = setInterval(function () {
      remaining -= 1;
      if (remaining <= 0) {
        clearInterval(interval);
        adCountdownEl.textContent = "You're all set!";
        adContinueBtn.classList.remove("hidden");
      } else {
        adCountdownEl.textContent = "You can continue in " + remaining + "s…";
      }
    }, 1000);
  }

  const requiredSecondsParam = parseInt(params.get("req"), 10);
  // Randomized per-open by the bot within the admin's configured range; when
  // absent, falls back to the old behavior of requiring the full video.
  const requiredSeconds = Number.isFinite(requiredSecondsParam) && requiredSecondsParam > 0
    ? requiredSecondsParam
    : null;

  let player = null;
  let maxAllowedTime = 0;
  let pollHandle = null;
  const SEEK_TOLERANCE_SECONDS = 2;

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player("player", {
      videoId: videoId,
      playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
      events: {
        onReady: function () {
          if (adGatePassed) statusEl.textContent = "Watch the full video to unlock your bonus.";
        },
        onStateChange: onPlayerStateChange,
        onPlaybackRateChange: function () {
          if (player && typeof player.getPlaybackRate === "function" && player.getPlaybackRate() !== 1) {
            player.setPlaybackRate(1);
          }
        },
      },
    });
  };

  function onPlayerStateChange(event) {
    if (!adGatePassed) return;
    if (event.data === YT.PlayerState.PLAYING) {
      if (!pollHandle) pollHandle = setInterval(checkProgress, 500);
    } else if (event.data === YT.PlayerState.ENDED) {
      stopPolling();
      unlockClaim();
    } else if (event.data === YT.PlayerState.PAUSED) {
      // leave the polling loop running; a paused video can't be scrubbed further anyway
    }
  }

  function checkProgress() {
    if (!player || typeof player.getCurrentTime !== "function") return;
    const current = player.getCurrentTime();
    if (current > maxAllowedTime + SEEK_TOLERANCE_SECONDS) {
      player.seekTo(maxAllowedTime, true);
    } else if (current > maxAllowedTime) {
      maxAllowedTime = current;
    }
    if (requiredSeconds && maxAllowedTime >= requiredSeconds) {
      stopPolling();
      unlockClaim();
    }
  }

  function stopPolling() {
    if (pollHandle) {
      clearInterval(pollHandle);
      pollHandle = null;
    }
  }

  function unlockClaim() {
    statusEl.textContent = "Video complete — claim your bonus!";
    claimBtn.disabled = false;
    claimBtn.textContent = "🎉 Claim Bonus";
  }

  claimBtn.addEventListener("click", function () {
    if (claimBtn.disabled) return;
    claimBtn.disabled = true;
    claimBtn.textContent = "Claiming…";
    tg.sendData(JSON.stringify({ completed: true, videoId: videoId }));
    tg.close();
  });

  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
})();
</script>
</body>
</html>
